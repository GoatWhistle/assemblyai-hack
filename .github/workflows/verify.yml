name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: lint
        run: npx biome check src app tests scripts

      - name: typecheck
        run: npx tsc --noEmit

      - name: test
        run: npx vitest run --coverage

      - name: file length
        run: bash scripts/check-file-length.sh

      - name: package size
        run: bash scripts/check-package-size.sh

      - name: import cycles
        run: bash scripts/check-import-cycles.sh

      - name: package subject
        run: bash scripts/check-package-subject.sh

      - name: language
        run: bash scripts/check-ascii.sh

      - name: tokens
        run: bash scripts/check-tokens.sh

      - name: colocation
        run: node scripts/check-colocation.mjs

      - name: token references
        run: node scripts/check-token-refs.mjs

      - name: contrast
        run: node scripts/check-contrast.mjs

      - name: secrets
        run: bash scripts/check-secrets.sh

      - name: keyterms purity
        run: npx vitest run tests/lasa/keyterms-purity.test.ts

      - name: held-out seal
        run: bash scripts/check-heldout-seal.sh

      - name: gate invariant
        run: bash scripts/check-gate-invariant.sh

      - name: gate mutation
        run: bash scripts/check-gate-mutation.sh
